name: Graphe de contributions animé

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#852c2c&color_dots=#ebedf0,#f2cfc9,#de9488,#b4473d,#852c2c
            dist/snake-dark.svg?palette=github-dark&color_snake=#e0786c&color_dots=#161b22,#3d1a18,#5f2421,#852c2c,#c4544f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
